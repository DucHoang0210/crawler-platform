server:
  port: 8080

spring:
  application:
    name: crawler-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/crawler_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: update
        format_sql: true
#       dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cho phép Flyway tự khởi tạo bảng public.tenants ở Schema public khi app start
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public