services:

  redis:
    image: redis:7-alpine

    container_name:
      crawler-redis

    ports:
      - "6379:6379"

    command:
      redis-server
      --appendonly yes

    volumes:
      - crawler-redis-data:/data

    restart:
      unless-stopped

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio

    command:
      - minio
      - server
      - /mnt/data
      - --console-address
      - ":9001"
      - --license
      - /minio.license

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:ChangeMe123456!}

    volumes:
      - minio_data:/mnt/data
      - ./infra/minio/minio.license:/minio.license:ro

    ports:
      - "9000:9000"
      - "9001:9001"

    restart: unless-stopped

volumes:

  crawler-redis-data:
  minio_data: